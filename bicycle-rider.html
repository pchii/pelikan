<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelikan Bicycle Animation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #10151f;
    font-family: system-ui, sans-serif;
  }
  .card {
    width: min(960px, 94vw);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    background: #87ceeb;
  }
  svg { display: block; width: 100%; height: auto; }
  h1 {
    color: #fff;
    font-size: 20px;
    margin: 18px 0 0;
    letter-spacing: .5px;
  }

  /* --- scenery scroll (seamless: elements duplicated at +900px) --- */
  .clouds { animation: scroll450 34.3s linear infinite; } /* 26 px/s = road/16 */
  .hills  { animation: scroll450 17.1s linear infinite; } /* 53 px/s = road/8 */
  .trees  { animation: scroll450 8.6s linear infinite; }  /* 105 px/s = road/4 */
  @keyframes scroll450 { to { transform: translateX(-900px); } }

  /* rider body bob (legs are anchored at the hip, so only upper body bobs) */
  #upperBody { animation: bob 1.61s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* pelican wing flap */
  #wing { transform-origin: 392px 244px; animation: flap 1.61s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
</style>
</head>
<body>

<div class="card">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated pelikan riding a bicycle">

  <!-- sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6f2"/>
      <stop offset="1" stop-color="#dff4ff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="90" cy="90" r="46" fill="#ffdf5e" opacity=".95"/>
  <circle cx="90" cy="90" r="62" fill="#ffdf5e" opacity=".25"/>

  <!-- clouds (duplicated at +900 for seamless loop) -->
  <g class="clouds" fill="#ffffff" opacity=".9">
    <g id="cloudsA">
      <ellipse cx="220" cy="90"  rx="52" ry="18"/>
      <ellipse cx="258" cy="78"  rx="34" ry="14"/>
      <ellipse cx="520" cy="140" rx="60" ry="20"/>
      <ellipse cx="560" cy="126" rx="36" ry="15"/>
      <ellipse cx="760" cy="70"  rx="44" ry="16"/>
    </g>
    <use href="#cloudsA" x="900"/>
  </g>

  <!-- distant hills (duplicated at +900) -->
  <g class="hills">
    <g id="hillsA">
      <path d="M0 430 L120 320 L260 430 Z"  fill="#9fd4b7"/>
      <path d="M180 430 L340 290 L520 430 Z" fill="#8cc9a4"/>
      <path d="M430 430 L560 330 L700 430 Z" fill="#9fd4b7"/>
      <path d="M640 430 L790 300 L940 430 Z" fill="#8cc9a4"/>
    </g>
    <use href="#hillsA" x="900"/>
  </g>

  <!-- trees (duplicated at +900) -->
  <g class="trees">
    <g id="treesA">
      <g transform="translate(150,430)">
        <rect x="-7" y="-52" width="14" height="52" rx="4" fill="#7a5230"/>
        <circle cx="0" cy="-70" r="34" fill="#3e8e5a"/>
        <circle cx="-26" cy="-48" r="24" fill="#49a066"/>
        <circle cx="26" cy="-48" r="24" fill="#49a066"/>
      </g>
      <g transform="translate(470,430)">
        <rect x="-7" y="-52" width="14" height="52" rx="4" fill="#7a5230"/>
        <circle cx="0" cy="-70" r="34" fill="#3e8e5a"/>
        <circle cx="-26" cy="-48" r="24" fill="#49a066"/>
        <circle cx="26" cy="-48" r="24" fill="#49a066"/>
      </g>
      <g transform="translate(780,430)">
        <rect x="-7" y="-52" width="14" height="52" rx="4" fill="#7a5230"/>
        <circle cx="0" cy="-70" r="34" fill="#3e8e5a"/>
        <circle cx="-26" cy="-48" r="24" fill="#49a066"/>
        <circle cx="26" cy="-48" r="24" fill="#49a066"/>
      </g>
    </g>
    <use href="#treesA" x="900"/>
  </g>

  <!-- ground + road -->
  <rect x="0" y="430" width="900" height="40" fill="#454a55"/>
  <rect x="0" y="470" width="900" height="30" fill="#8fd07a"/>
  <rect x="0" y="430" width="900" height="4"  fill="#e9edf3" opacity=".8"/>
  <line id="roadDash" x1="0" y1="451" x2="900" y2="451"
        stroke="#f4d03e" stroke-width="6" stroke-dasharray="70 50"/>

  <!-- wheel shadows -->
  <ellipse cx="310" cy="428" rx="66" ry="8" fill="#000" opacity=".22"/>
  <ellipse cx="550" cy="428" rx="66" ry="8" fill="#000" opacity=".22"/>

  <!-- ====== bike ====== -->
  <!-- back leg (behind the frame) -->
  <g id="backLegG">
    <polyline id="legB" points="" fill="none" stroke="#d9823b" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footB" d="" fill="#d9823b"/>
  </g>
  <g id="pedalB"><rect x="-12" y="-4" width="24" height="8" rx="3" fill="#2a2d35"/></g>
  <line id="crankB" x1="360" y1="365" x2="360" y2="395" stroke="#3a3e48" stroke-width="6" stroke-linecap="round"/>

  <!-- wheels -->
  <g id="wheelB">
    <circle cx="310" cy="370" r="54" fill="none" stroke="#22262e" stroke-width="12"/>
    <g id="spokesB" stroke="#cfd6e0" stroke-width="3">
      <line x1="310" y1="322" x2="310" y2="418"/>
      <line x1="310" y1="322" x2="310" y2="418" transform="rotate(60 310 370)"/>
      <line x1="310" y1="322" x2="310" y2="418" transform="rotate(120 310 370)"/>
    </g>
    <circle cx="310" cy="370" r="7" fill="#454a55"/>
    <circle cx="310" cy="370" r="9" fill="#565b66"/>
  </g>
  <g id="wheelF">
    <circle cx="550" cy="370" r="54" fill="none" stroke="#22262e" stroke-width="12"/>
    <g id="spokesF" stroke="#cfd6e0" stroke-width="3">
      <line x1="550" y1="322" x2="550" y2="418"/>
      <line x1="550" y1="322" x2="550" y2="418" transform="rotate(60 550 370)"/>
      <line x1="550" y1="322" x2="550" y2="418" transform="rotate(120 550 370)"/>
    </g>
    <circle cx="550" cy="370" r="7" fill="#454a55"/>
  </g>

  <!-- frame -->
  <g stroke="#e0533d" stroke-width="9" stroke-linecap="round">
    <line x1="310" y1="370" x2="360" y2="365"/>   <!-- chain stay -->
    <line x1="310" y1="370" x2="358" y2="268"/>   <!-- seat stay -->
    <line x1="360" y1="365" x2="358" y2="268"/>   <!-- seat tube -->
    <line x1="360" y1="365" x2="520" y2="290"/>   <!-- down tube -->
    <line x1="358" y1="268" x2="520" y2="290"/>   <!-- top tube -->
    <line x1="520" y1="290" x2="550" y2="370"/>   <!-- fork -->
    <line x1="520" y1="290" x2="528" y2="266"/>   <!-- stem -->
  </g>
  <!-- handlebar -->
  <path d="M528 266 h16" stroke="#2a2d35" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- saddle + post -->
  <line x1="358" y1="268" x2="354" y2="256" stroke="#2a2d35" stroke-width="7" stroke-linecap="round"/>
  <rect x="332" y="248" width="40" height="11" rx="5" fill="#2a2d35"/>
  <!-- chainring + chain -->
  <circle cx="360" cy="365" r="10" fill="#3a3e48"/>
  <line x1="360" y1="355" x2="310" y2="361" stroke="#3a3e48" stroke-width="3"/>
  <line x1="360" y1="375" x2="310" y2="379" stroke="#3a3e48" stroke-width="3"/>

  <!-- upper body (bobs slightly) -->
  <!-- pelican body (bobs slightly) -->
  <g id="upperBody">
    <!-- tail -->
    <path d="M344 270 L318 282 L346 288 Z" fill="#d8d2c4"/>
    <!-- body -->
    <ellipse cx="390" cy="256" rx="50" ry="28" fill="#f7f4ea" stroke="#d8d2c4" stroke-width="2"
             transform="rotate(-12 390 256)"/>
    <!-- neck -->
    <path d="M430 244 C446 234 450 226 458 216" fill="none" stroke="#f7f4ea" stroke-width="14" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="466" cy="212" r="13" fill="#f7f4ea" stroke="#d8d2c4" stroke-width="1.5"/>
    <!-- eye -->
    <circle cx="470" cy="208" r="2.5" fill="#2a2d35"/>
    <!-- beak: top + pouch -->
    <path d="M472 206 L534 214 L472 219 Z" fill="#f39c4a"/>
    <path d="M472 219 Q502 236 534 214 L472 222 Z" fill="#e07b39"/>
    <!-- wing (flaps) -->
    <path id="wing" d="M358 240 C378 224 412 224 424 240 C408 254 380 258 360 252 Z"
          fill="#e8e2d2" stroke="#d8d2c4" stroke-width="1.5"/>
  </g>

  <!-- front crank + pedal + leg (in front of frame) -->
  <line id="crankF" x1="360" y1="365" x2="360" y2="395" stroke="#3a3e48" stroke-width="6" stroke-linecap="round"/>
  <g id="pedalF"><rect x="-12" y="-4" width="24" height="8" rx="3" fill="#2a2d35"/></g>
  <polyline id="legF" points="" fill="none" stroke="#f39c4a" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <path id="footF" d="" fill="#f39c4a"/>

</svg>
</div>

<h1>🚴 Pelikan on a bicycle</h1>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const B = { x: 360, y: 365 };          // bottom bracket (crank center)
  const CRANK = 30;                       // crank arm length
  const H = { x: 352, y: 268 };           // hip (fixed anchor)
  const L1 = 80, L2 = 80;                 // thigh / shin
  const ROAD_SPEED = 420;                 // px/s — single source of truth for wheel, road, parallax

  const wheelDegPerSec = 360 * ROAD_SPEED / (2 * Math.PI * 54); // tire radius 54
  const GEAR_RATIO = 2;                        // chainring r10 : cog r9 ≈ 2:1 → crank slower than wheel
  const crankRevPerSec = ROAD_SPEED / (2 * Math.PI * 54) / GEAR_RATIO; // ≈ 37 rpm, realistic cadence

  function pedalPoint(angle) {
    return { x: B.x + CRANK * Math.cos(angle), y: B.y + CRANK * Math.sin(angle) };
  }

  // two-bone IK: hip -> knee -> pedal
  function legPoints(p) {
    const dx = p.x - H.x, dy = p.y - H.y;
    const d = Math.hypot(dx, dy) || 0.001;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const mx = H.x + dx * a / d, my = H.y + dy * a / d;
    const px = -dy / d, py = dx / d;
    const k1 = { x: mx + h * px, y: my + h * py };
    const k2 = { x: mx - h * px, y: my - h * py };
    const knee = k1.x >= k2.x ? k1 : k2;   // knee points forward
    const f = { x: p.x, y: p.y - 4 };       // foot sits on top of pedal
    return `${H.x},${H.y} ${knee.x.toFixed(1)},${knee.y.toFixed(1)} ${f.x.toFixed(1)},${f.y.toFixed(1)}`;
  }

  // pelican webbed foot following the pedal
  function footPath(p) {
    return `M${(p.x - 8).toFixed(1)} ${(p.y - 7).toFixed(1)} `
         + `L${(p.x + 14).toFixed(1)} ${(p.y - 3).toFixed(1)} `
         + `L${(p.x - 2).toFixed(1)} ${(p.y + 4).toFixed(1)} Z`;
  }

  let t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;

    const th = t * crankRevPerSec * 2 * Math.PI;
    const pf = pedalPoint(th);
    const pb = pedalPoint(th + Math.PI);

    $('legF').setAttribute('points', legPoints(pf));
    $('legB').setAttribute('points', legPoints(pb));

    $('crankF').setAttribute('x2', pf.x);
    $('crankF').setAttribute('y2', pf.y);
    $('crankB').setAttribute('x2', pb.x);
    $('crankB').setAttribute('y2', pb.y);

    $('pedalF').setAttribute('transform', `translate(${pf.x.toFixed(1)} ${pf.y.toFixed(1)})`);
    $('pedalB').setAttribute('transform', `translate(${pb.x.toFixed(1)} ${pb.y.toFixed(1)})`);

    $('footF').setAttribute('d', footPath(pf));
    $('footB').setAttribute('d', footPath(pb));

    const deg = (t * wheelDegPerSec) % 360;
    $('spokesF').setAttribute('transform', `rotate(${deg} 550 370)`);
    $('spokesB').setAttribute('transform', `rotate(${deg} 310 370)`);

    $('roadDash').setAttribute('stroke-dashoffset', -(t * ROAD_SPEED));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
